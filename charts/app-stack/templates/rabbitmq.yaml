apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rabbitmq-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" (dict "Release" .Release "component" "rabbitmq" "version" "3.13") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "app.selector" (dict "Release" .Release "component" "rabbitmq") | nindent 4 }}
  ports:
    - name: broker
      port: 5672
      targetPort: broker
    - name: http
      port: 15672
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" (dict "Release" .Release "component" "rabbitmq" "version" "3.13") | nindent 4 }}
spec:
  selector:
    {{- include "app.selector" (dict "Release" .Release "component" "rabbitmq") | nindent 4 }}
  ports:
    - name: broker
      port: 5672
      targetPort: broker
    - name: http
      port: 15672
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" (dict "Release" .Release "component" "rabbitmq" "version" "3.13") | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "app.selector" (dict "Release" .Release "component" "rabbitmq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" (dict "Release" .Release "component" "rabbitmq" "version" "3.13") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.rabbitmq.runAsUser }}
        runAsGroup: {{ .Values.rabbitmq.runAsGroup }}
        fsGroup: {{ .Values.rabbitmq.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: broker
              containerPort: 5672
            - name: http
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.rabbitmq.userKey }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.rabbitmq.passwordKey }}
            - name: RABBITMQ_DEFAULT_VHOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.rabbitmq.vhostKey }}
          startupProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 20
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "app.labels" (dict "Release" .Release "component" "rabbitmq" "version" "3.13") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage }}
        {{- if .Values.rabbitmq.storageClass }}
        storageClassName: {{ .Values.rabbitmq.storageClass | quote }}
        {{- end }}
